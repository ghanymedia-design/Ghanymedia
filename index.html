<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ghany Media AI Tools</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>🚀 Ghany Media AI</h1>
<p>All in One AI Tools</p>

</header>

<nav>

<a href="#text">AI Text</a>
<a href="#story">AI Story</a>
<a href="#image">AI Image</a>
<a href="#video">AI Video</a>

</nav>

<div class="container">

<div class="card" id="text">

<h2>AI Text Generator</h2>

<input id="textInput" placeholder="Tulis topik">

<button onclick="aiText()">Generate</button>

<div class="result" id="textResult"></div>

</div>

<div class="card" id="story">

<h2>AI Story Generator</h2>

<input id="storyInput" placeholder="Contoh: petualangan di hutan">

<button onclick="aiStory()">Generate</button>

<div class="result" id="storyResult"></div>

</div>

<div class="card" id="image">

<h2>AI Image Prompt</h2>

<input id="imageInput" placeholder="Contoh: naga emas">

<button onclick="aiImage()">Generate</button>

<div class="result" id="imageResult"></div>

</div>

<div class="card" id="video">

<h2>AI Video Prompt</h2>

<input id="videoInput" placeholder="Contoh: samurai berjalan">

<button onclick="aiVideo()">Generate</button>

<div class="result" id="videoResult"></div>

</div>

</div>

<footer>

<p>© 2026 Ghany Media</p>

</footer>

<script src="script.js"></script>

</body>
</html>
