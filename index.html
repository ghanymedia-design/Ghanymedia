<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinity AI Tools</title>

<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

<style>
body{
background: radial-gradient(circle at top, #0f172a, #020617);
color:white;
font-family: Arial;
}

.glow{
box-shadow:0 0 20px #3b82f6;
}

.card{
background: rgba(255,255,255,0.05);
backdrop-filter: blur(10px);
border-radius:15px;
padding:20px;
}
</style>
</head>

<body>

<header class="p-6 flex justify-between items-center">
<h1 class="text-2xl font-bold text-blue-400">Infinity AI Tools</h1>

<nav class="space-x-4">
<a href="#" class="hover:text-blue-400">Home</a>
<a href="#" class="hover:text-blue-400">Tools</a>
<a href="#" class="hover:text-blue-400">About</a>
</nav>
</header>

<section class="text-center mt-20">

<h2 class="text-5xl font-bold mb-6">
All In One AI Tools
</h2>

<p class="text-gray-400 mb-10">
Generate prompts, stories, and AI ideas instantly
</p>

</section>


<section class="max-w-3xl mx-auto mt-10">

<div class="card">

<h3 class="text-xl mb-4">AI Prompt Generator</h3>

<input id="idea"
class="w-full p-3 rounded bg-gray-800 mb-4"
placeholder="Enter your idea...">

<button onclick="generatePrompt()"
class="bg-blue-500 px-6 py-3 rounded glow">
Generate Prompt
</button>

<p id="result" class="mt-6 text-blue-300"></p>

</div>

</section>


<script>

function generatePrompt(){

let idea = document.getElementById("idea").value;

let prompt =
"Cinematic ultra realistic scene about " +
idea +
", 8k, dramatic lighting, highly detailed, professional film look";

document.getElementById("result").innerText = prompt;

}

</script>

</body>
</html>
